# 本地开发 Mosquitto broker（替代 tools/dev_broker.py 的 amqtt）。
# 端口与固件 sdkconfig (CONFIG_RX_MQTT_URI) 和后端 app/config.py 统一为 11883。
# 背景: 1883 落在 Hyper-V 端口排除段 1815-1914 内,绑定会报 WSAEACCES(10013)。
# 启动: "C:\Program Files\mosquitto\mosquitto.exe" -c 本文件路径 -v
listener 11883
allow_anonymous true
persistence false
